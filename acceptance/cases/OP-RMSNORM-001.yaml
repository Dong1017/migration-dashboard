case_id: OP-RMSNORM-001
title: "RMSNorm API numeric equivalence evidence contract"
scope: "API equivalence/watch case for torch_npu.npu_rms_norm -> mindspore.ops.rms_norm. This validates the evidence pipeline and API behavior equivalence for one minimal fp32 case; it is not a custom-op development gate."
repo_target: "api_audit"
watch_type: "api_equivalence"
custom_op_required: false
priority: P0
status: open

inputs:
  - shape: [2, 16, 128]
    dtype: fp32
  - shape: [2, 16, 128]
    dtype: bf16
  - shape: [1, 1, 128]
    dtype: bf16

apis:
  golden:
    - "torch_npu.npu_rms_norm"
    - "PT reference"
  actual:
    - "mindspore.ops.rms_norm"
    - "ms_custom_ops candidate"

golden:
  source: "torch_npu.npu_rms_norm / PT reference"
  command: "python acceptance/tools/collect_rmsnorm_golden.py --case acceptance/cases/OP-RMSNORM-001.yaml --shape 2,16,128 --dtype fp32 --seed 0 --epsilon 1e-6 --output-root acceptance/artifacts/OP-RMSNORM-001 --golden-source torch_npu"
  artifact_dir: "acceptance/artifacts/OP-RMSNORM-001/golden"

actual:
  source: "mindspore.ops.rms_norm / ms_custom_ops candidate"
  command: "python acceptance/tools/collect_rmsnorm_actual.py --case acceptance/cases/OP-RMSNORM-001.yaml --output-root acceptance/artifacts/OP-RMSNORM-001"
  artifact_dir: "acceptance/artifacts/OP-RMSNORM-001/actual"

compare:
  command: "python acceptance/tools/compare_outputs.py --case acceptance/cases/OP-RMSNORM-001.yaml --golden acceptance/artifacts/OP-RMSNORM-001/golden/rmsnorm_shape_2x16x128_fp32_seed0.npz --actual acceptance/artifacts/OP-RMSNORM-001/actual/rmsnorm_shape_2x16x128_fp32_seed0.npz --metadata acceptance/artifacts/OP-RMSNORM-001/metadata.json --key output"
  metrics:
    - finite_check
    - max_abs_error
    - max_rel_error
    - pass_ratio
  threshold:
    fp32:
      atol: 1.0e-5
      rtol: 1.0e-5
      pass_ratio: 0.9999
    bf16:
      atol: 2.0e-2
      rtol: 2.0e-2
      pass_ratio: 0.999

evidence:
  required_fields:
    - dtype
    - shape
    - layout
    - seed
    - rank
    - environment

result:
  artifact: "acceptance/artifacts/OP-RMSNORM-001/result.json"
  allowed_status:
    - pass
    - fail
    - blocked
    - not_run
    - xfail
