case_id: OP-ADD-RMSNORM-001
title: "Add RMSNorm custom op equivalence evidence contract"
scope: "Custom-op acceptance case for torch_npu.npu_add_rms_norm. This case requires a real MindSpore/ms_custom_ops add_rms_norm implementation before actual collection can pass. Until then, actual collection is blocked and this skeleton must not be treated as migration evidence."
repo_target: "ms_custom_ops"
watch_type: "custom_op_acceptance"
custom_op_required: true
priority: P0
status: open

inputs:
  - shape: [2, 16, 128]
    dtype: fp32
  - shape: [2, 16, 128]
    dtype: bf16

apis:
  golden:
    - "torch_npu.npu_add_rms_norm"
  actual:
    - "mindspore.ops.custom.add_rms_norm"
    - "ms_custom_ops.add_rms_norm"
    - "project-specific custom op wrapper"

scenarios:
  - residual_add_then_rmsnorm
  - output_equivalence
  - blocked_until_custom_op_available

golden:
  source: "torch_npu.npu_add_rms_norm PT golden artifacts"
  command: "TBD: collect torch_npu.npu_add_rms_norm golden input/residual/gamma/output artifacts"
  artifact_dir: "acceptance/artifacts/OP-ADD-RMSNORM-001/golden"

actual:
  source: "MindSpore/ms_custom_ops add_rms_norm custom-op actual artifacts"
  command: "BLOCKED: implement and register add_rms_norm custom op before collecting actual artifacts"
  artifact_dir: "acceptance/artifacts/OP-ADD-RMSNORM-001/actual"

compare:
  command: "python acceptance/tools/compare_outputs.py --case acceptance/cases/OP-ADD-RMSNORM-001.yaml"
  metrics:
    - finite_check
    - max_abs_error
    - max_rel_error
    - pass_ratio
  threshold:
    fp32:
      atol: 1.0e-5
      rtol: 1.0e-5
      pass_ratio: 0.9999
    bf16:
      atol: 2.0e-2
      rtol: 2.0e-2
      pass_ratio: 0.999

evidence:
  required_fields:
    - dtype
    - shape
    - layout
    - seed
    - tensor_rank
    - distributed
    - environment
    - golden_source_kind
    - actual_source_kind

result:
  artifact: "acceptance/artifacts/OP-ADD-RMSNORM-001/result.json"
  allowed_status:
    - pass
    - fail
    - blocked
    - not_run
    - xfail
