name: Status Update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply-status-update:
    if: startsWith(github.event.comment.body, '/status-update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply status update
        id: apply
        run: |
          python scripts/apply_status_comment.py \
            --event "$GITHUB_EVENT_PATH" \
            --config data/status_config.json \
            --status-dir data/status \
            --result status_update_result.json
          python scripts/build_data.py \
            --source migration-analysis-v0.4.md \
            --output data.json \
            --status-dir data/status \
            --config data/status_config.json
      - name: Commit dashboard data
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status data.json
          git commit -m "Update dashboard status from issue comment"
          git push
      - name: Reply success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('status_update_result.json', 'utf8'));
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Status update applied.\n\n- module: ${result.module}\n- targets: ${result.applied.map(x => `\`${x}\``).join(', ')}`
            });
      - name: Reply failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Status update rejected. Check the Actions log for the validation error.'
            });
